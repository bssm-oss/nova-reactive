name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      latest: ${{ steps.version.outputs.latest }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Maven snapshots are exactly *-SNAPSHOT:
          # 2.13.0-SNAPSHOT -> snapshot/manual only; 2.13.0-alpha.SNAPSHOT and
          # 2.13.0+SNAPSHOT -> release repository; 2.13.0-rc.1 -> prerelease.
          if [ "$EVENT_NAME" = "push" ]; then
            case "$REF_NAME" in
              v*) VERSION="${REF_NAME#v}" ;;
              *) echo "Release tags must be named v<SemVer>." >&2; exit 1 ;;
            esac
            case "$VERSION" in
              *-SNAPSHOT) echo "SNAPSHOT tags cannot be released." >&2; exit 1 ;;
            esac
            export NOVA_VERSION="$VERSION"
            VALIDATED_VERSION="$(./gradlew -q printNovaVersion "-Pnova.version=$NOVA_VERSION")"
            if [ "$VALIDATED_VERSION" != "$NOVA_VERSION" ]; then
              echo "Validated version did not match the tag." >&2
              exit 1
            fi
            case "${VERSION%%+*}" in
              *-*) PRERELEASE=true; LATEST=false ;;
              *) PRERELEASE=false; LATEST=true ;;
            esac
          else
            VERSION="$(./gradlew -q printNovaVersion)"
            case "$VERSION" in
              *-SNAPSHOT) ;;
              *) echo "Manual publishing requires the configured SNAPSHOT version." >&2; exit 1 ;;
            esac
            PRERELEASE=false
            LATEST=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Verify build before publishing
        env:
          NOVA_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build "-Pnova.version=$NOVA_VERSION"

      - name: Publish to Sonatype Central
        env:
          NOVA_VERSION: ${{ steps.version.outputs.version }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToCentralRepository "-Pnova.version=$NOVA_VERSION" --no-configuration-cache

      - name: Transfer OSSRH staging to Central Portal
        if: ${{ github.event_name == 'push' }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.bssm-oss?publishing_type=automatic"

  github-release:
    needs: publish
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish drafted GitHub Release
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          publish: true
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ needs.publish.outputs.prerelease }}
          latest: ${{ needs.publish.outputs.latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
